<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALI Nabine · Formations en ligne</title>
<style>
:root{--bg:#f7f8fb;--card:#fff;--tx:#1b2333;--mut:#5d6a82;--pri:#1f5fd6;--pri2:#e8f0ff;--bd:#dfe4ee;--ok:#1a9a5b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141f;--card:#182030;--tx:#eaeef6;--mut:#9aa8c2;--pri:#6ea0ff;--pri2:#1c2a47;--bd:#2a3550;--ok:#43c88a}}
:root[data-theme="dark"]{--bg:#0f141f;--card:#182030;--tx:#eaeef6;--mut:#9aa8c2;--pri:#6ea0ff;--pri2:#1c2a47;--bd:#2a3550;--ok:#43c88a}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
.w{max-width:960px;margin:0 auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--bd);z-index:5}
header .w{display:flex;justify-content:space-between;align-items:center;padding-top:12px;padding-bottom:12px}
header a{color:var(--tx);text-decoration:none}
.logo{font-weight:700}
.back{color:var(--mut);font-size:.92rem}
.hero{padding:40px 0 24px}
.hero h1{font-size:clamp(1.6rem,5vw,2.5rem);line-height:1.15;margin:0 0 12px}
.hero p{color:var(--mut);max-width:640px;font-size:1.05rem}
.btn{display:inline-block;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:1rem;cursor:pointer;text-decoration:none;margin:0 8px 8px 0}
.btn.alt{background:var(--pri2);color:var(--pri)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stats span{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;font-size:.9rem}
h2{margin:34px 0 14px;font-size:1.4rem}
.cat{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:700px){.cat{grid-template-columns:1fr 1fr}}
.cc{display:flex;flex-direction:column;gap:6px}
.cc .em{font-size:2rem}
.cc h3{margin:0}
.cc p{margin:0;color:var(--mut)}
.cc .pr{font-weight:700;color:var(--pri);margin-top:6px}
.cc.soon{opacity:.6}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:760px){.grid{grid-template-columns:320px 1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.mod h3{margin:14px 0 6px;font-size:.95rem;color:var(--mut)}
.mod h3:first-child{margin-top:0}
.les{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:9px;color:var(--tx);font:inherit;cursor:pointer}
.les:hover{background:var(--pri2)}
.les.on{background:var(--pri2);border-color:var(--pri)}
.dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:12px;color:#fff}
.les.done .dot{background:var(--ok);border-color:var(--ok)}
.les small{display:block;color:var(--mut)}
.video{aspect-ratio:16/9;background:linear-gradient(135deg,#1f3a73,#1f5fd6);border-radius:12px;display:grid;place-items:center;color:#fff;text-align:center;padding:16px}
.video b{display:block;font-size:1.1rem;margin-bottom:8px}
.player h3{margin:14px 0 4px;font-size:1.2rem}
.player p{color:var(--mut);margin:0 0 14px}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.faq details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin-bottom:10px}
.faq summary{cursor:pointer;font-weight:600}
.faq p{color:var(--mut);margin:8px 0 0}
footer{margin-top:40px;padding:22px 0;border-top:1px solid var(--bd);color:var(--mut);font-size:.9rem;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="w"><a class="logo" href="#catalogue">🎓 ALI Nabine · Formations</a><a class="back" id="back" href="#catalogue" hidden>← Toutes les formations</a></div></header>

<main class="w">
<section id="home">
<div class="hero"><h1>Des formations en ligne, en vidéo, à votre rythme</h1>
<p>Choisissez une formation, suivez les leçons et inscrivez-vous directement par WhatsApp.</p></div>
<div class="cat" id="cat"></div>
</section>
<section id="course" hidden></section>
</main>
<footer>© 2026 ALI Nabine · Formations en ligne</footer>

<script>
var WA="22870182299";
/* ===== AJOUTER UNE FORMATION : copiez un bloc ci-dessous et changez les textes =====
   id : lettres minuscules, chiffres et tirets (sert au lien #id)
   file : nom du fichier à télécharger (laisser "" s’il n’y en a pas)
   url : lien de la vidéo YouTube de la leçon ("" si pas encore prête) */
var COURSES=[
{id:"cartes-scolaires",em:"🪪",title:"Confection des cartes scolaires",short:"De la collecte des données à l’impression de cartes d’identité scolaires professionnelles.",desc:"Une formation en vidéo, ouverte à toute personne intéressée : de la collecte des données à l’impression de cartes d’identité scolaires professionnelles.",price:"10 000 FCFA",file:"logiciel-cartes-scolaires.xlsm",image:"exemple-carte-scolaire.svg",
mods:[
{m:"1. Introduction",l:[{t:"Qu’est-ce qu’une carte scolaire ?",d:"5 min",x:"Rôle de la carte, informations obligatoires et bonnes pratiques.",url:""},{t:"Matériel et logiciels",d:"8 min",x:"Ordinateur, imprimante, logiciels nécessaires.",url:""}]},
{m:"2. Collecte des données",l:[{t:"Préparer la liste des élèves",d:"10 min",x:"Structurer un fichier Excel : nom, prénoms, classe, matricule.",url:""},{t:"Photos d’identité",d:"9 min",x:"Prise de vue, cadrage, nommage et redimensionnement des photos.",url:""}]},
{m:"3. Conception du modèle",l:[{t:"Dessiner le recto et le verso",d:"14 min",x:"Logo, couleurs, emplacement de la photo et des textes.",url:""}]},
{m:"4. Génération automatique",l:[{t:"Insérer les données dans le modèle",d:"15 min",x:"Fusionner la liste des élèves avec le modèle pour produire toutes les cartes.",url:""},{t:"Ajouter les photos automatiquement",d:"12 min",x:"Associer chaque photo à la fiche de l’élève.",url:""}]},
{m:"5. Impression et finition",l:[{t:"Impression et découpe",d:"10 min",x:"Réglages d’impression, papier ou PVC, plastification.",url:""}]},
{m:"6. Contrôle et distribution",l:[{t:"Vérifier et distribuer les cartes",d:"7 min",x:"Contrôle qualité, corrections et remise aux élèves.",url:""}]}
]},
{id:"tableaux-service-ia",em:"🤖",title:"Faire des tableaux de service avec l’IA",short:"Créez en quelques minutes emplois du temps, répartitions des enseignants et calendriers de surveillance grâce à l’intelligence artificielle.",desc:"Apprenez à utiliser l’intelligence artificielle pour produire rapidement vos tableaux de service : répartition des enseignants, emplois du temps, calendriers de surveillance. Aucune connaissance en programmation n’est nécessaire.",price:"5 000 FCFA",file:"",
mods:[
{m:"1. Découvrir l’IA",l:[{t:"Qu’est-ce que l’IA et à quoi sert-elle ?",d:"6 min",x:"Comprendre ce que l’IA peut et ne peut pas faire, et choisir un outil.",url:""},{t:"Bien écrire sa demande",d:"10 min",x:"Comment formuler une consigne claire pour obtenir un bon résultat.",url:""}]},
{m:"2. Préparer les informations",l:[{t:"Rassembler les données",d:"8 min",x:"Enseignants, matières, classes, heures : ce qu’il faut fournir à l’IA.",url:""}]},
{m:"3. Créer les tableaux",l:[{t:"Tableau de répartition des enseignants",d:"14 min",x:"Générer le tableau des matières, classes, heures et titulaires.",url:""},{t:"Emploi du temps",d:"15 min",x:"Construire un emploi du temps sans conflit d’horaires.",url:""},{t:"Calendrier de surveillance des devoirs",d:"12 min",x:"Organiser la rotation des enseignants pour les épreuves.",url:""}]},
{m:"4. Finaliser",l:[{t:"Mise en forme dans Word ou Excel",d:"12 min",x:"Entête, couleurs, signatures et impression du tableau.",url:""},{t:"Vérifier et corriger les erreurs",d:"8 min",x:"Contrôler le travail de l’IA avant de le diffuser.",url:""}]}
]}
];

function $(i){return document.getElementById(i)}
function count(c){var n=0;c.mods.forEach(function(g){n+=g.l.length});return n}
function waLink(c){return "https://wa.me/"+WA+"?text="+encodeURIComponent("Bonjour, je souhaite m’inscrire à la formation « "+c.title+" ».")}

/* ---- catalogue ---- */
function showHome(){
$("home").hidden=false;$("course").hidden=true;$("back").hidden=true;document.title="ALI Nabine · Formations en ligne";
var h="";
COURSES.forEach(function(c){
if(c.soon){h+='<div class="card cc soon"><span class="em">'+c.em+'</span><h3>'+c.title+'</h3><p>'+c.short+'</p><span class="pr">Bientôt disponible</span></div>';return}
h+='<div class="card cc"><span class="em">'+c.em+'</span><h3>'+c.title+'</h3><p>'+c.short+'</p><p>🎬 '+count(c)+' leçons · 📚 '+c.mods.length+' modules</p><span class="pr">'+c.price+'</span><a class="btn" style="margin-top:8px;align-self:flex-start" href="#'+c.id+'">Voir la formation</a></div>'});
$("cat").innerHTML=h;
}

/* ---- page d’une formation ---- */
function showCourse(c){
$("home").hidden=true;$("course").hidden=false;$("back").hidden=false;document.title=c.title+" · ALI Nabine";
var all=[],done={},cur=0,KEY="prog-"+c.id;
try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
c.mods.forEach(function(g){g.l.forEach(function(x){all.push(x)})});
var h='<div class="hero"><h1>'+c.em+' '+c.title+'</h1><p>'+c.desc+'</p>'
+'<button class="btn" id="st">Commencer la formation</button><a class="btn alt" target="_blank" rel="noopener" href="'+waLink(c)+'">💬 S’inscrire · '+c.price+'</a>'
+'<div class="stats"><span>🎬 '+all.length+' leçons vidéo</span><span>📚 '+c.mods.length+' modules</span><span>💰 '+c.price+'</span></div></div>'
+(c.image?'<h2>Exemple</h2><div class="card" style="max-width:560px;text-align:center"><img src="'+c.image+'" alt="Exemple de carte d\u2019identit\u00e9 scolaire" style="max-width:100%;border-radius:10px"><p style="color:var(--mut);margin:10px 0 0">Exemple illustratif, avec un \u00e9l\u00e8ve fictif.</p></div>':'')
+'<h2>Le cours</h2><div class="grid" id="lessons"><div class="card mod" id="mods"></div><div class="card player"><div class="video" id="vid"></div><h3 id="lt"></h3><p id="ld"></p><button class="btn" id="mark"></button><div style="margin-top:14px"><div class="bar"><i id="pb"></i></div><small id="pt" style="color:var(--mut)"></small></div></div></div>';
if(c.file)h+='<h2>Le logiciel</h2><div class="card" style="max-width:560px"><p style="margin-top:0;color:var(--mut)">Téléchargez le classeur Excel avec macros (VBA) utilisé dans la formation. Il est protégé par un mot de passe, communiqué par WhatsApp après votre inscription. Ouvrez-le avec Excel sur ordinateur et activez les macros.</p><a class="btn" href="'+c.file+'" download>⬇️ Télécharger le logiciel (mot de passe fourni après inscription)</a></div>';
h+='<h2>Inscription</h2><div class="card" style="max-width:480px"><p style="margin-top:0;color:var(--mut)">Prix : <b>'+c.price+'</b>. Écrivez-nous sur WhatsApp pour recevoir les informations de paiement et d’accès aux vidéos.</p><a class="btn" target="_blank" rel="noopener" href="'+waLink(c)+'">💬 S’inscrire sur WhatsApp</a><p style="color:var(--mut);margin-bottom:0">Ou appelez : <b>+228 70 18 22 99</b></p></div>'
+'<div class="faq"><h2>Questions fréquentes</h2><details><summary>Faut-il des connaissances en informatique ?</summary><p>Non. Les bases de Word ou Excel suffisent pour suivre la formation.</p></details><details><summary>La formation est-elle payante ?</summary><p>Oui. Tarif : '+c.price+'. Elle est ouverte à toute personne intéressée.</p></details><details><summary>Comment m’inscrire ?</summary><p>Appuyez sur le bouton WhatsApp : vous recevrez les informations de paiement et d’accès.</p></details></div>';
$("course").innerHTML=h;
function render(){
var m="",i=0;
c.mods.forEach(function(g){m+="<h3>"+g.m+"</h3>";g.l.forEach(function(x){
m+='<button class="les'+(i==cur?" on":"")+(done[i]?" done":"")+'" data-i="'+i+'"><span class="dot">'+(done[i]?"✓":"")+'</span><span>'+x.t+'<small>'+x.d+'</small></span></button>';i++})});
$("mods").innerHTML=m;
var l=all[cur];
$("vid").innerHTML=l.url?'<div><b>▶ '+l.t+'</b><a class="btn alt" target="_blank" rel="noopener" href="'+l.url+'">Ouvrir la vidéo</a></div>':'<div><b>🎬 Vidéo bientôt disponible</b>'+l.d+'</div>';
$("lt").textContent=l.t;$("ld").textContent=l.x;
$("mark").textContent=done[cur]?"Terminée ✓ (annuler)":"Marquer comme terminée";
var n=Object.keys(done).filter(function(k){return done[k]}).length;
$("pb").style.width=(100*n/all.length)+"%";$("pt").textContent=n+" / "+all.length+" leçons terminées";
Array.prototype.forEach.call(document.querySelectorAll(".les"),function(b){b.onclick=function(){cur=+b.dataset.i;render()}});
}
$("mark").onclick=function(){done[cur]=!done[cur];try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}render()};
$("st").onclick=function(){$("lessons").scrollIntoView({behavior:"smooth"})};
render();
}

function route(){
var id=location.hash.slice(1),c=null;
COURSES.forEach(function(x){if(x.id==id&&!x.soon)c=x});
if(c)showCourse(c);else showHome();
window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
